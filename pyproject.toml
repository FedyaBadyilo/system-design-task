[project]
name = "system-design-task"
version = "0.1.0"
description = "Minimal support-ticket automation PoC"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pydantic",
    "python-dotenv",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
support-ai-demo = "support_ai.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_ai"]
